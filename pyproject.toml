[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zvm-otel-exporter"
version = "0.1.0"
description = "Prometheus and OpenTelemetry exporter for z/VM metrics via the Feilong REST API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "z/VM OTel Exporter contributors" }]
keywords = ["zvm", "prometheus", "opentelemetry", "mainframe", "feilong"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "httpx>=0.27",
    "opentelemetry-api>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-sdk>=1.27",
    "prometheus-client>=0.20",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
zvm-otel-exporter = "zvm_otel_exporter.cli:main"
zvm-otel-exporter-mock = "zvm_otel_exporter.mock:main"

[project.urls]
Feilong = "https://github.com/openmainframeproject/feilong"
Predecessor = "https://github.com/zvmexporter/zvm_exporter"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zvm_otel_exporter = ["fixtures/*.json", "fixtures/vmcp/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
