# promtool unit tests for dashboards/grafana/alerts.yml.
# rule_files is resolved relative to this file.
rule_files:
  - alerts.yml
evaluation_interval: 1m
tests:
  # ZvmExporterProcessDown fires at 12m
  - interval: 1m
    input_series:
      - series: "up{job=\"zvm-otel-exporter\",instance=\"zvm1:9110\"}"
        values: "1 1 0x10"
      - series: "zvm_exporter_up{job=\"zvm-otel-exporter\",instance=\"zvm1:9110\"}"
        values: "1x12"
    alert_rule_test:
      - eval_time: 12m
        alertname: ZvmExporterProcessDown
        exp_alerts:
          - exp_labels:
              severity: "critical"
              job: "zvm-otel-exporter"
              instance: "zvm1:9110"
            exp_annotations:
              summary: "z/VM exporter process is not being scraped"
              description: "Prometheus is not scraping the exporter. This rule assumes the scrape job label is zvm-otel-exporter. Change the job matcher if your configuration uses another name. up == 0 fires per target while Prometheus still remembers it. absent(zvm_exporter_up) fires when no exporter series exist at all. It does not mean Feilong failed."
  # ZvmExporterProcessDown fires at 6m
  - interval: 1m
    input_series:
      - series: "up{job=\"zvm-otel-exporter\",instance=\"zvm1:9110\"}"
        values: "1x10"
    alert_rule_test:
      - eval_time: 6m
        alertname: ZvmExporterProcessDown
        exp_alerts:
          - exp_labels:
              severity: "critical"
            exp_annotations:
              summary: "z/VM exporter process is not being scraped"
              description: "Prometheus is not scraping the exporter. This rule assumes the scrape job label is zvm-otel-exporter. Change the job matcher if your configuration uses another name. up == 0 fires per target while Prometheus still remembers it. absent(zvm_exporter_up) fires when no exporter series exist at all. It does not mean Feilong failed."
  # ZvmExporterProcessDown healthy at 12m
  - interval: 1m
    input_series:
      - series: "up{job=\"zvm-otel-exporter\",instance=\"zvm1:9110\"}"
        values: "1x12"
      - series: "zvm_exporter_up{job=\"zvm-otel-exporter\",instance=\"zvm1:9110\"}"
        values: "1x12"
    alert_rule_test:
      - eval_time: 12m
        alertname: ZvmExporterProcessDown
        exp_alerts: []
  # ZvmFeilongDown fires at 6m
  - interval: 1m
    input_series:
      - series: "zvm_exporter_up"
        values: "0x10"
      - series: "up{job=\"zvm-otel-exporter\",instance=\"zvm1:9110\"}"
        values: "1x10"
    alert_rule_test:
      - eval_time: 6m
        alertname: ZvmFeilongDown
        exp_alerts:
          - exp_labels:
              severity: "critical"
            exp_annotations:
              summary: "Feilong host collection is failing"
              description: "The exporter process is being scraped and zvm_exporter_up has been 0 for 5 minutes. Feilong is unreachable or host collection failed. This is not a dead process. A dead process is ZvmExporterProcessDown."
  # ZvmFeilongDown healthy at 6m
  - interval: 1m
    input_series:
      - series: "zvm_exporter_up"
        values: "1x10"
      - series: "up{job=\"zvm-otel-exporter\",instance=\"zvm1:9110\"}"
        values: "1x10"
    alert_rule_test:
      - eval_time: 6m
        alertname: ZvmFeilongDown
        exp_alerts: []
  # ZvmSmapiDown fires at 15m
  - interval: 1m
    input_series:
      - series: "zvm_smapi_healthy"
        values: "0x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: ZvmSmapiDown
        exp_alerts:
          - exp_labels:
              severity: "warning"
            exp_annotations:
              summary: "SMAPI is reported unhealthy"
              description: "zvm_smapi_healthy has been 0 for 15 minutes. Guest stats may be missing. The exporter process and Feilong host collection can still be up."
  # ZvmSmapiDown healthy at 15m
  - interval: 1m
    input_series:
      - series: "zvm_smapi_healthy"
        values: "1x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: ZvmSmapiDown
        exp_alerts: []
  # ZvmExporterStale fires at 10m
  - interval: 1m
    input_series:
      - series: "zvm_exporter_scrape_stale"
        values: "1x15"
    alert_rule_test:
      - eval_time: 10m
        alertname: ZvmExporterStale
        exp_alerts:
          - exp_labels:
              severity: "warning"
            exp_annotations:
              summary: "z/VM exporter is serving a stale snapshot"
              description: "Host collection failed and previous series are still being served. Check Feilong before trusting the dashboard."
  # ZvmExporterStale healthy at 10m
  - interval: 1m
    input_series:
      - series: "zvm_exporter_scrape_stale"
        values: "0x15"
    alert_rule_test:
      - eval_time: 10m
        alertname: ZvmExporterStale
        exp_alerts: []
  # ZvmVmcpDown fires at 15m
  - interval: 1m
    input_series:
      - series: "zvm_vmcp_up"
        values: "0x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: ZvmVmcpDown
        exp_alerts:
          - exp_labels:
              severity: "warning"
            exp_annotations:
              summary: "vmcp commands are failing"
              description: "The last vmcp pass did not succeed. Paging, spool, and system CPU utilization are missing or old. Privilege class D is required for QUERY ALLOC."
  # ZvmVmcpDown healthy at 15m
  - interval: 1m
    input_series:
      - series: "zvm_vmcp_up"
        values: "1x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: ZvmVmcpDown
        exp_alerts: []
  # ZvmVmcpCacheStale fires at 10m
  - interval: 1m
    input_series:
      - series: "zvm_vmcp_cache_age_seconds"
        values: "1000x15"
    alert_rule_test:
      - eval_time: 10m
        alertname: ZvmVmcpCacheStale
        exp_alerts:
          - exp_labels:
              severity: "warning"
            exp_annotations:
              summary: "vmcp cache is older than 15 minutes"
              description: "Cache age stayed above 900 seconds. The command pass is backing off or not running."
  # ZvmVmcpCacheStale healthy at 10m
  - interval: 1m
    input_series:
      - series: "zvm_vmcp_cache_age_seconds"
        values: "100x15"
    alert_rule_test:
      - eval_time: 10m
        alertname: ZvmVmcpCacheStale
        exp_alerts: []
  # ZvmVmcpFailures fires at 15m
  - interval: 1m
    input_series:
      - series: "zvm_vmcp_consecutive_failures"
        values: "3x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: ZvmVmcpFailures
        exp_alerts:
          - exp_labels:
              severity: "warning"
            exp_annotations:
              summary: "vmcp has failed more than twice in a row"
              description: "Consecutive failures remain above 2. Read the exporter log for timeout, overflow, or an HCP error."
  # ZvmVmcpFailures healthy at 15m
  - interval: 1m
    input_series:
      - series: "zvm_vmcp_consecutive_failures"
        values: "2x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: ZvmVmcpFailures
        exp_alerts: []
  # ZvmVmcpSlow fires at 15m
  - interval: 1m
    input_series:
      - series: "zvm_vmcp_command_duration_seconds"
        values: "11x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: ZvmVmcpSlow
        exp_alerts:
          - exp_labels:
              severity: "warning"
            exp_annotations:
              summary: "vmcp command pass is slow"
              description: "The last pass took more than 10 seconds. That is close to the timeout budget and adds load. Check that vmcp is not hanging."
  # ZvmVmcpSlow healthy at 15m
  - interval: 1m
    input_series:
      - series: "zvm_vmcp_command_duration_seconds"
        values: "10x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: ZvmVmcpSlow
        exp_alerts: []
  # ZvmCpuHigh fires at 15m
  - interval: 1m
    input_series:
      - series: "zvm_system_cpu_utilization"
        values: "0.9x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: ZvmCpuHigh
        exp_alerts:
          - exp_labels:
              severity: "warning"
            exp_annotations:
              summary: "z/VM CPU utilization above 85 percent"
              description: "INDICATE LOAD stayed above 85 percent for 15 minutes. Look at guest CPU time and Linux steal before adding CPUs."
  # ZvmCpuHigh healthy at 15m
  - interval: 1m
    input_series:
      - series: "zvm_system_cpu_utilization"
        values: "0.85x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: ZvmCpuHigh
        exp_alerts: []
  # ZvmCpuCritical fires at 15m
  - interval: 1m
    input_series:
      - series: "zvm_system_cpu_utilization"
        values: "0.96x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: ZvmCpuCritical
        exp_alerts:
          - exp_labels:
              severity: "critical"
            exp_annotations:
              summary: "z/VM CPU utilization above 95 percent"
              description: "INDICATE LOAD stayed above 95 percent for 15 minutes. The LPAR has almost no CPU headroom."
  # ZvmCpuCritical healthy at 15m
  - interval: 1m
    input_series:
      - series: "zvm_system_cpu_utilization"
        values: "0.95x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: ZvmCpuCritical
        exp_alerts: []
  # ZvmLinuxStealHigh fires at 20m
  - interval: 1m
    input_series:
      - series: "node_cpu_seconds_total{mode=\"steal\",instance=\"linux1\"}"
        values: "0+9x40"
    alert_rule_test:
      - eval_time: 20m
        alertname: ZvmLinuxStealHigh
        exp_alerts:
          - exp_labels:
              severity: "warning"
              instance: "linux1"
            exp_annotations:
              summary: "Linux CPU steal above 10 percent"
              description: "node_exporter reports steal above 10 percent for 15 minutes. Compare with z/VM CPU utilization on the same system. This rule does nothing until node_exporter is scraped."
  # ZvmLinuxStealHigh healthy at 20m
  - interval: 1m
    input_series:
      - series: "node_cpu_seconds_total{mode=\"steal\",instance=\"linux1\"}"
        values: "0+1x40"
    alert_rule_test:
      - eval_time: 20m
        alertname: ZvmLinuxStealHigh
        exp_alerts: []
  # ZvmLinuxStealCritical fires at 20m
  - interval: 1m
    input_series:
      - series: "node_cpu_seconds_total{mode=\"steal\",instance=\"linux1\"}"
        values: "0+20x40"
    alert_rule_test:
      - eval_time: 20m
        alertname: ZvmLinuxStealCritical
        exp_alerts:
          - exp_labels:
              severity: "critical"
              instance: "linux1"
            exp_annotations:
              summary: "Linux CPU steal above 25 percent"
              description: "Steal stayed above 25 percent. The guest is waiting on the hypervisor often enough to explain application latency."
  # ZvmLinuxStealCritical healthy at 20m
  - interval: 1m
    input_series:
      - series: "node_cpu_seconds_total{mode=\"steal\",instance=\"linux1\"}"
        values: "0+9x40"
    alert_rule_test:
      - eval_time: 20m
        alertname: ZvmLinuxStealCritical
        exp_alerts: []
  # ZvmMemoryOvercommitHigh fires at 30m
  - interval: 1m
    input_series:
      - series: "zvm_guest_memory_total_bytes{zvm_host_name=\"OPNSTK2\",zvm_guest_id=\"LINUX1\"}"
        values: "200x40"
      - series: "zvm_host_memory_limit_bytes{zvm_host_name=\"OPNSTK2\"}"
        values: "100x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: ZvmMemoryOvercommitHigh
        exp_alerts:
          - exp_labels:
              severity: "warning"
              zvm_host_name: "OPNSTK2"
            exp_annotations:
              summary: "Guest memory is more than 1.5 times LPAR memory"
              description: "Sum of guest-reported total memory exceeds 1.5 times the LPAR. Confirm total_memory units on a real system before acting."
  # ZvmMemoryOvercommitHigh healthy at 30m
  - interval: 1m
    input_series:
      - series: "zvm_guest_memory_total_bytes{zvm_host_name=\"OPNSTK2\",zvm_guest_id=\"LINUX1\"}"
        values: "100x40"
      - series: "zvm_host_memory_limit_bytes{zvm_host_name=\"OPNSTK2\"}"
        values: "100x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: ZvmMemoryOvercommitHigh
        exp_alerts: []
  # ZvmMemoryOvercommitCritical fires at 30m
  - interval: 1m
    input_series:
      - series: "zvm_guest_memory_total_bytes{zvm_host_name=\"OPNSTK2\",zvm_guest_id=\"LINUX1\"}"
        values: "200x40"
      - series: "zvm_guest_memory_total_bytes{zvm_host_name=\"OPNSTK2\",zvm_guest_id=\"LINUX2\"}"
        values: "200x40"
      - series: "zvm_host_memory_limit_bytes{zvm_host_name=\"OPNSTK2\"}"
        values: "100x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: ZvmMemoryOvercommitCritical
        exp_alerts:
          - exp_labels:
              severity: "warning"
              zvm_host_name: "OPNSTK2"
            exp_annotations:
              summary: "Guest memory is more than 3 times LPAR memory"
              description: "Defined guest memory is far above real LPAR memory. Warning only, same policy as paging and spool. This does not page."
  # ZvmMemoryOvercommitCritical healthy at 30m
  - interval: 1m
    input_series:
      - series: "zvm_guest_memory_total_bytes{zvm_host_name=\"OPNSTK2\",zvm_guest_id=\"LINUX1\"}"
        values: "200x40"
      - series: "zvm_host_memory_limit_bytes{zvm_host_name=\"OPNSTK2\"}"
        values: "100x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: ZvmMemoryOvercommitCritical
        exp_alerts: []
  # ZvmPagingForecast fires at 7h
  - interval: 1m
    input_series:
      - series: "zvm_paging_utilization"
        values: "0+0.002x500"
    alert_rule_test:
      - eval_time: 7h
        alertname: ZvmPagingForecast
        exp_alerts:
          - exp_labels:
              severity: "warning"
            exp_annotations:
              summary: "Paging space is forecast to pass 90 percent within 7 days"
              description: "A straight line through the last 6 hours of paging utilization crosses 0.9 inside a week. This is warning only."
  # ZvmPagingForecast healthy at 7h
  - interval: 1m
    input_series:
      - series: "zvm_paging_utilization"
        values: "0.2x500"
    alert_rule_test:
      - eval_time: 7h
        alertname: ZvmPagingForecast
        exp_alerts: []
  # ZvmSpoolForecast fires at 7h
  - interval: 1m
    input_series:
      - series: "zvm_spool_utilization"
        values: "0+0.002x500"
    alert_rule_test:
      - eval_time: 7h
        alertname: ZvmSpoolForecast
        exp_alerts:
          - exp_labels:
              severity: "warning"
            exp_annotations:
              summary: "Spool space is forecast to pass 90 percent within 7 days"
              description: "A straight line through the last 6 hours of spool utilization crosses 0.9 inside a week. This is warning only."
  # ZvmSpoolForecast healthy at 7h
  - interval: 1m
    input_series:
      - series: "zvm_spool_utilization"
        values: "0.2x500"
    alert_rule_test:
      - eval_time: 7h
        alertname: ZvmSpoolForecast
        exp_alerts: []
  # ZvmPagingHigh fires at 30m
  - interval: 1m
    input_series:
      - series: "zvm_paging_utilization"
        values: "0.85x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: ZvmPagingHigh
        exp_alerts:
          - exp_labels:
              severity: "warning"
            exp_annotations:
              summary: "Paging space is above 80 percent"
              description: "Paging utilization stayed above 80 percent. Warning only. Look at the 7-day projection before adding volumes."
  # ZvmPagingHigh healthy at 30m
  - interval: 1m
    input_series:
      - series: "zvm_paging_utilization"
        values: "0.8x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: ZvmPagingHigh
        exp_alerts: []
  # ZvmSpoolHigh fires at 30m
  - interval: 1m
    input_series:
      - series: "zvm_spool_utilization"
        values: "0.9x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: ZvmSpoolHigh
        exp_alerts:
          - exp_labels:
              severity: "warning"
            exp_annotations:
              summary: "Spool space is above 80 percent"
              description: "Spool utilization stayed above 80 percent. Warning only. Clean spool before treating this as an outage."
  # ZvmSpoolHigh healthy at 30m
  - interval: 1m
    input_series:
      - series: "zvm_spool_utilization"
        values: "0.5x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: ZvmSpoolHigh
        exp_alerts: []
