# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit reviews non-draft pull requests to the default branch.
# A maintainer still approves. See CONTRIBUTING.md.
language: en-US
reviews:
  profile: chill
  poem: false
  review_status: true
  review_progress: true
  commit_status: true
  # An errored review fails the check. A rate-limited review still succeeds,
  # so the maintainer rule in CONTRIBUTING.md still applies.
  fail_commit_status: true
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    # Keep reviewing the latest commit. The default pause hides later commits.
    auto_pause_after_reviewed_commits: 0
  path_filters:
    - "**"
    - "!dashboards/grafana/*.json"
    - "!dashboards/dynatrace/**/*.json"
  path_instructions:
    - path: "src/**"
      instructions: |
        Do not call GET /guests/{userid}. That route returns the user directory
        entry, and the entry contains the guest password in clear text.
        Do not add a CP command to the default vmcp pass. A new command stays
        off by default, names its privilege class, and updates the README
        performance limits.
        Events stay off unless events.enabled is true. The first scrape is a
        baseline. A carried scrape or an incomplete power list must not confirm
        a logon or a logoff. Guest ids are not Prometheus labels.
        Do not log tokens, headers, or response bodies. Log paths and status
        codes. Do not keep scrape history. Memory is the last confirmed view
        plus at most one pending view.
    - path: "dashboards/**"
      instructions: |
        Paging and spool are capacity warnings, not outage alerts.
        Grafana and Dynatrace dashboard JSON is generated by
        dashboards/build_pack.py. Comment on the generator and on the alert
        rules. Do not ask for a hand edit of the generated JSON.
        PromQL may use only series this exporter emits, or node_exporter series
        the docs already name.
    - path: "examples/**"
      instructions: |
        Examples are templates. They must not contain real tokens.
        The fixture Feilong server is synthetic. Say so when a demo uses it.
    - path: "**/*.md"
      instructions: |
        The fixture Feilong server is synthetic. Do not claim a live z/VM run
        unless the change includes that evidence and names the z/VM and Feilong
        versions. Examples must not contain real tokens.
    - path: "tests/**"
      instructions: |
        Tests must exercise the new behavior. A test that only repeats a
        constant from the same change does not count. Fixture tokens such as
        test-admin-token are not production credentials and must be labeled
        as fixtures.
