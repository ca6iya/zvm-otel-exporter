name: DCO

on:
  pull_request:

jobs:
  signed-off-by:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require Signed-off-by on every pull request commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: sh .github/scripts/check-dco.sh
