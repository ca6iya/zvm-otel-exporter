# OpenTelemetry Collector that receives z/VM metrics and exposes them to
# Prometheus. A commented Dynatrace exporter is included below.
#
# The exporter sends OTLP/gRPC to collector:4317 by default:
#   zvm-otel-exporter --otlp --otlp-endpoint http://otel-collector:4317 --otlp-protocol grpc

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
  # Direct OTLP/HTTP to Dynatrace. The collector appends /v1/metrics.
  # Create an API token with the metrics.ingest scope.
  # otlphttp/dynatrace:
  #   endpoint: https://${DT_ENV_ID}.live.dynatrace.com/api/v2/otlp
  #   headers:
  #     Authorization: "Api-Token ${DT_API_TOKEN}"

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
      # exporters: [prometheus, otlphttp/dynatrace]
